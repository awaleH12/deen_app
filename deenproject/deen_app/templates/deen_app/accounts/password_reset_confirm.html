{% extends "deen_app/layouts/base.html" %}
{% block title %}Set New Password | Deen App{% endblock %}
{% block content %}
<main>
  <section class="login-section container" style="margin-top: 5rem; max-width: 500px;">
    <h1 class="mb-4">Set New Password</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <div class="mb-3">
        <label for="id_new_password1" class="form-label">New Password</label>
        {{ form.new_password1 }}
      </div>
      <div class="mb-3">
        <label for="id_new_password2" class="form-label">Confirm New Password</label>
        {{ form.new_password2 }}
      </div>
      <button type="submit" class="btn btn-primary w-100">Set Password</button>
    </form>
  </section>
</main>
{% endblock %}
