{% extends "deen_app/layouts/base.html" %}
{% block title %}Password Reset Complete | Deen App{% endblock %}
{% block content %}
<main>
  <section class="login-section container" style="margin-top: 5rem; max-width: 500px;">
    <h1 class="mb-4">Password Reset Complete</h1>
    <div class="alert alert-success" style="background: #fff; padding: 2rem; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-align: center;">
      <p>Your password has been set. You may now log in with your new password.</p>
      <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100 mt-3">Back to Login</a>
    </div>
  </section>
</main>
{% endblock %}
